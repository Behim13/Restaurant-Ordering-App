<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Ordering App</title>

    <!-- Styling link -->
    <link rel="stylesheet" href="styles.css" />

    <!-- font Smythe -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Jimmy's Diner</h1>
        <h3>The best burgers and pizzas in town</h3>
      </header>
      <section id="menu">
        <!-- Added with JS -->
      </section>
      <div class="order hidden"></div>
      <div class="payingCard hidden">
        <h1>Enter card details</h1>
        <input type="text" placeholder="Enter your name" />
        <input type="text" placeholder="Enter card number" />
        <input type="text" placeholder="Enter CVV" />
        <button class="green-btn">Pay</button>
      </div>
    </main>
    <script src="script.js" type="module"></script>
  </body>
</html>
