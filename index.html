<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Ordering App</title>

    <!-- Styling link -->
    <link rel="stylesheet" href="styles.css" />

    <!-- font Smythe -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <header>
        <h1>Jimmy's Diner</h1>
        <h3>The best burgers and pizzas in town</h3>
      </header>
      <section>
        <div class="menu-item">
          <img src="images/pizza.png" alt="pizza" />
          <div class="item-info">
            <h2>Pizza</h2>
            <p>pepperoni, mushroom, mozarella</p>
            <p class="item-price">$14</p>
          </div>
          <button>+</button>
        </div>
      </section>
    </main>
  </body>
</html>
